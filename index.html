<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLUE CAT — Everything Men Need. One Premium Store.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ============ TOKENS ============ */
:root{
  --ink:#14161a;
  --ink-soft:#3b3f46;
  --paper:#f6f4ef;
  --paper-raised:#ffffff;
  --charcoal:#2b2e33;
  --gray:#9a9ca3;
  --gray-line:#e2ddd2;
  --blue:#1c3a63;
  --blue-deep:#122946;
  --blue-soft:#e7edf4;
  --white:#ffffff;
  --gold-accent:#b08d57; /* used extremely sparingly, badges only */
  --danger:#a3402f;
  --ok:#2f6b4f;
  --radius-s:2px;
  --radius-m:3px;
  --shadow-card: 0 1px 0 rgba(20,22,26,0.06);
  --maxw:1240px;
  --font-head:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --font-body:'Inter', 'Helvetica Neue', Arial, sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  /* keep light as default even under OS dark mode for brand consistency,
     but soften pure white slightly for eye comfort */
}
*{box-sizing:border-box;}
html{scroll-padding-top: calc(72px + env(safe-area-inset-top,0px));}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
img,svg{max-width:100%;display:block;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;line-height:1.08;letter-spacing:-0.01em;color:var(--ink);}
.overflow-x{overflow-x:auto;-webkit-overflow-scrolling:touch;}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

/* ============ HEADER ============ */
.topbar{background:var(--blue-deep);color:#dfe6ee;font-size:12.5px;}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;height:34px;}
.topbar span{opacity:.85}

header.site{
  position:sticky;top:0;z-index:50;background:rgba(246,244,239,.92);backdrop-filter:saturate(140%) blur(6px);
  border-bottom:1px solid var(--gray-line);
}
.header-row{display:flex;align-items:center;gap:28px;height:68px;}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo svg{width:30px;height:30px;}
.logo .word{font-family:var(--font-head);font-weight:800;font-size:20px;letter-spacing:-0.01em;}
.logo .word b{color:var(--blue);font-weight:800;}
nav.primary{display:flex;gap:22px;flex:1;}
nav.primary a{font-size:14.5px;font-weight:500;color:var(--ink-soft);padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap;}
nav.primary a:hover,nav.primary a.active{color:var(--ink);border-color:var(--blue);}
.header-actions{display:flex;align-items:center;gap:6px;margin-left:auto;}
.icon-btn{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;color:var(--ink);border-radius:var(--radius-m);}
.icon-btn:hover{background:rgba(20,22,26,.06);}
.icon-btn svg{width:20px;height:20px;}
.badge-count{position:absolute;top:2px;right:2px;background:var(--blue);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.search-box{display:none;align-items:center;gap:8px;background:#fff;border:1px solid var(--gray-line);border-radius:var(--radius-m);padding:0 10px;height:38px;flex:1;max-width:320px;}
.search-box input{border:none;outline:none;font-size:14px;flex:1;background:transparent;}
@media (min-width:960px){.search-box{display:flex;}}

/* mobile menu */
.mobile-menu-btn{display:flex;}
@media (min-width:960px){.mobile-menu-btn{display:none;}nav.primary{display:flex;}}
@media (max-width:959px){nav.primary{display:none;}}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;padding:13px 26px;border-radius:var(--radius-s);cursor:pointer;border:1px solid transparent;transition:background .15s ease, color .15s ease, border-color .15s ease;}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:var(--blue-deep);}
.btn-outline{background:transparent;border-color:var(--ink);color:var(--ink);}
.btn-outline:hover{background:var(--ink);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-blue:hover{background:var(--blue-deep);}
.btn-block{width:100%;}
.btn-sm{padding:9px 16px;font-size:13px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.link-btn{background:none;border:none;padding:0;cursor:pointer;color:var(--blue);font-weight:600;font-size:14px;}

/* ============ SECTIONS ============ */
main{display:block;min-height:60vh;}
.section{padding:56px 0;}
.section-tight{padding:36px 0;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;gap:16px;}
.section-head h2{font-size:26px;}
.section-head p{color:var(--ink-soft);font-size:14.5px;margin-top:6px;}
.section-alt{background:var(--white);border-top:1px solid var(--gray-line);border-bottom:1px solid var(--gray-line);}
.section-ink{background:var(--ink);color:#eceae4;}
.section-ink h2,.section-ink h3{color:#fff;}

/* ============ HERO ============ */
.hero{background:var(--paper);border-bottom:1px solid var(--gray-line);}
.hero .wrap{display:grid;grid-template-columns:1fr;gap:36px;padding-top:44px;padding-bottom:44px;align-items:center;}
@media (min-width:860px){.hero .wrap{grid-template-columns:1.1fr 1fr;padding-top:64px;padding-bottom:64px;}}
.hero-eyebrow{font-size:13px;color:var(--blue);font-weight:600;margin-bottom:14px;}
.hero h1{font-size:40px;max-width:540px;}
@media (min-width:640px){.hero h1{font-size:56px;}}
.hero p.lead{margin-top:18px;color:var(--ink-soft);font-size:16.5px;max-width:440px;}
.hero-ctas{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;}
.hero-art{aspect-ratio:4/5;background:linear-gradient(180deg,var(--blue-deep),var(--blue));border-radius:var(--radius-m);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.hero-art svg{width:60%;height:60%;opacity:.95;}
.hero-art:after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.15);}

/* ============ CATEGORY GRID ============ */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media (min-width:640px){.cat-grid{grid-template-columns:repeat(4,1fr);}}
@media (min-width:960px){.cat-grid{grid-template-columns:repeat(6,1fr);}}
.cat-card{background:var(--white);border:1px solid var(--gray-line);border-radius:var(--radius-m);padding:22px 14px;text-align:center;cursor:pointer;transition:border-color .15s ease, transform .15s ease;}
.cat-card:hover{border-color:var(--blue);transform:translateY(-2px);}
.cat-card svg{width:30px;height:30px;margin:0 auto 12px;color:var(--blue);}
.cat-card span{font-size:13.5px;font-weight:600;}

/* ============ PRODUCT GRID / CARD ============ */
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media (min-width:640px){.prod-grid{grid-template-columns:repeat(3,1fr);}}
@media (min-width:960px){.prod-grid{grid-template-columns:repeat(4,1fr);}}
.rail{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;}
.rail .prod-card{min-width:200px;scroll-snap-align:start;}
@media (min-width:640px){.rail .prod-card{min-width:230px;}}

.prod-card{background:var(--white);border:1px solid var(--gray-line);border-radius:var(--radius-m);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s ease, border-color .15s ease;}
.prod-card:hover{border-color:var(--charcoal);box-shadow:0 6px 18px rgba(20,22,26,.08);}
.prod-media{position:relative;aspect-ratio:1/1;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.prod-media svg{width:46%;height:46%;color:var(--blue);}
.prod-badge{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:4px 8px;border-radius:2px;background:var(--ink);color:#fff;}
.prod-badge.limited{background:var(--danger);}
.prod-badge.new{background:var(--blue);}
.wish-toggle{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--gray-line);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.wish-toggle svg{width:16px;height:16px;}
.wish-toggle.active svg{fill:var(--danger);color:var(--danger);}
.quick-add{position:absolute;left:10px;right:10px;bottom:10px;background:var(--ink);color:#fff;border:none;padding:9px;font-size:12.5px;font-weight:600;border-radius:2px;cursor:pointer;opacity:0;transform:translateY(6px);transition:opacity .15s ease, transform .15s ease;}
.prod-card:hover .quick-add{opacity:1;transform:translateY(0);}
.prod-info{padding:12px 13px 14px;display:flex;flex-direction:column;gap:5px;flex:1;}
.prod-cat{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.04em;}
.prod-name{font-size:14px;font-weight:600;cursor:pointer;}
.prod-rating{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);}
.stars{color:var(--blue);letter-spacing:1px;font-size:12px;}
.prod-price{display:flex;align-items:baseline;gap:8px;margin-top:2px;}
.price-now{font-weight:700;font-size:15px;}
.price-old{font-size:12.5px;color:var(--gray);text-decoration:line-through;}
.price-off{font-size:11.5px;color:var(--danger);font-weight:700;}

/* ============ WHY BLUE CAT ============ */
.trust-grid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--gray-line);border:1px solid var(--gray-line);}
@media (min-width:760px){.trust-grid{grid-template-columns:repeat(4,1fr);}}
.trust-item{background:var(--white);padding:28px 22px;}
.trust-item svg{width:24px;height:24px;color:var(--blue);margin-bottom:14px;}
.trust-item h4{font-size:15.5px;margin-bottom:6px;}
.trust-item p{font-size:13.5px;color:var(--ink-soft);margin:0;}

/* ============ REVIEWS ============ */
.review-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media (min-width:760px){.review-grid{grid-template-columns:repeat(3,1fr);}}
.review-card{background:var(--white);border:1px solid var(--gray-line);padding:22px;border-radius:var(--radius-m);}
.review-card .stars{font-size:14px;margin-bottom:10px;display:block;}
.review-card p{font-size:14px;color:var(--ink-soft);margin:0 0 14px;}
.review-who{font-size:13px;font-weight:600;}
.review-who span{color:var(--gray);font-weight:400;display:block;font-size:12px;}

/* ============ BRAND STORY ============ */
.story{display:grid;grid-template-columns:1fr;gap:32px;align-items:center;}
@media (min-width:860px){.story{grid-template-columns:1fr 1fr;}}
.story-art{aspect-ratio:16/11;background:var(--charcoal);border-radius:var(--radius-m);display:flex;align-items:center;justify-content:center;}
.story-art svg{width:36%;color:#8fa7c4;}
.story h2{color:#fff;font-size:28px;margin-bottom:16px;}
.story p{color:#c7c9cd;font-size:15px;max-width:480px;margin:0 0 14px;}

/* ============ NEWSLETTER ============ */
.newsletter{background:var(--blue-deep);color:#fff;padding:44px 0;}
.newsletter .wrap{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;}
.newsletter h3{font-size:24px;color:#fff;}
.newsletter p{color:#c9d5e2;font-size:14.5px;max-width:420px;}
.newsletter-form{display:flex;gap:10px;width:100%;max-width:420px;flex-wrap:wrap;justify-content:center;}
.newsletter-form input{flex:1;min-width:200px;padding:12px 14px;border-radius:2px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:14px;}
.newsletter-form input::placeholder{color:#a9b8c8;}

/* ============ FOOTER ============ */
footer.site{background:var(--ink);color:#c9cbd0;padding:48px 0 18px;}
.footer-grid{display:grid;grid-template-columns:1fr;gap:32px;}
@media (min-width:760px){.footer-grid{grid-template-columns:2fr 1fr 1fr 1fr;}}
.footer-grid h5{color:#fff;font-size:13px;letter-spacing:.03em;margin-bottom:14px;}
.footer-grid a,.footer-grid p{display:block;font-size:13.5px;color:#a7a9ae;margin-bottom:9px;}
.footer-grid a:hover{color:#fff;}
.footer-bottom{border-top:1px solid #33353a;margin-top:34px;padding-top:18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:12.5px;color:#83858b;}
.pay-icons{display:flex;gap:8px;}
.pay-icons span{border:1px solid #46484d;padding:3px 8px;border-radius:2px;font-size:11px;}

/* ============ BREADCRUMB / PAGE HEAD ============ */
.crumb{font-size:12.5px;color:var(--gray);margin-bottom:14px;}
.crumb a:hover{color:var(--ink);}
.page-head{padding:34px 0 26px;border-bottom:1px solid var(--gray-line);background:var(--white);}
.page-head h1{font-size:28px;}
.page-head p{color:var(--ink-soft);font-size:14px;margin-top:6px;}

/* ============ SHOP LAYOUT ============ */
.shop-layout{display:grid;grid-template-columns:1fr;gap:28px;}
@media (min-width:900px){.shop-layout{grid-template-columns:220px 1fr;}}
.filters{display:flex;flex-direction:column;gap:22px;}
.filter-group h4{font-size:13px;margin-bottom:10px;}
.filter-opt{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);padding:5px 0;cursor:pointer;}
.filter-opt input{accent-color:var(--blue);}
.shop-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.shop-toolbar select{border:1px solid var(--gray-line);border-radius:2px;padding:8px 10px;font-size:13px;background:#fff;}
.mobile-filter-btn{display:inline-flex;}
@media (min-width:900px){.mobile-filter-btn{display:none;}}

/* ============ PRODUCT DETAIL ============ */
.pd-layout{display:grid;grid-template-columns:1fr;gap:36px;}
@media (min-width:900px){.pd-layout{grid-template-columns:1fr 1fr;}}
.pd-gallery-main{aspect-ratio:1/1;background:var(--blue-soft);border-radius:var(--radius-m);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.pd-gallery-main svg{width:42%;height:42%;color:var(--blue);}
.pd-thumbs{display:flex;gap:10px;}
.pd-thumb{width:64px;height:64px;background:var(--blue-soft);border:2px solid transparent;border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.pd-thumb.active{border-color:var(--ink);}
.pd-thumb svg{width:60%;color:var(--blue);}
.pd-info h1{font-size:24px;margin-bottom:8px;}
.pd-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
.pd-price{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;}
.pd-price .price-now{font-size:24px;}
.pd-stock{font-size:13px;color:var(--ok);margin-bottom:18px;}
.pd-stock.low{color:var(--danger);}
.option-group{margin-bottom:20px;}
.option-group h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:10px;font-weight:600;}
.swatch-row{display:flex;gap:10px;flex-wrap:wrap;}
.size-opt{min-width:44px;padding:9px 12px;border:1px solid var(--gray-line);border-radius:2px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;text-align:center;}
.size-opt.active{border-color:var(--ink);background:var(--ink);color:#fff;}
.color-opt{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--gray-line);cursor:pointer;}
.color-opt.active{box-shadow:0 0 0 2px var(--ink);}
.qty-row{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
.qty-control{display:flex;align-items:center;border:1px solid var(--gray-line);border-radius:2px;}
.qty-control button{width:36px;height:36px;background:none;border:none;font-size:16px;cursor:pointer;}
.qty-control span{width:34px;text-align:center;font-weight:600;font-size:14px;}
.pd-cta-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.pd-cta-row .btn{flex:1;min-width:150px;}
.pd-note{display:flex;gap:10px;font-size:13px;color:var(--ink-soft);padding:12px 0;border-top:1px solid var(--gray-line);}
.pd-note svg{width:18px;height:18px;flex-shrink:0;color:var(--blue);margin-top:1px;}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--gray-line);margin:44px 0 22px;overflow-x:auto;}
.tab-btn{padding:12px 0;font-size:14px;font-weight:600;color:var(--gray);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--ink);border-color:var(--blue);}
.tab-panel{display:none;font-size:14.5px;color:var(--ink-soft);max-width:760px;}
.tab-panel.active{display:block;}
.spec-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-line);font-size:14px;}
.spec-row span:first-child{color:var(--gray);}

/* ============ CART ============ */
.cart-layout{display:grid;grid-template-columns:1fr;gap:30px;}
@media (min-width:900px){.cart-layout{grid-template-columns:1fr 340px;}}
.cart-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--gray-line);}
.cart-item .prod-media{width:88px;height:88px;flex-shrink:0;border-radius:2px;}
.cart-item .prod-media svg{width:50%;height:50%;}
.cart-item-info{flex:1;display:flex;flex-direction:column;gap:4px;}
.cart-item-top{display:flex;justify-content:space-between;gap:10px;}
.cart-item-opts{font-size:12.5px;color:var(--gray);}
.cart-item-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;}
.remove-link{font-size:12.5px;color:var(--danger);background:none;border:none;cursor:pointer;padding:0;}
.summary-card{background:var(--white);border:1px solid var(--gray-line);border-radius:var(--radius-m);padding:22px;position:sticky;top:88px;}
.summary-row{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;color:var(--ink-soft);}
.summary-row.total{border-top:1px solid var(--gray-line);margin-top:8px;padding-top:14px;font-weight:700;color:var(--ink);font-size:16px;}
.coupon-row{display:flex;gap:8px;margin:14px 0;}
.coupon-row input{flex:1;padding:10px;border:1px solid var(--gray-line);border-radius:2px;font-size:13px;}
.empty-state{text-align:center;padding:70px 20px;}
.empty-state svg{width:52px;height:52px;color:var(--gray);margin:0 auto 18px;}
.empty-state h3{margin-bottom:8px;}
.empty-state p{color:var(--ink-soft);margin-bottom:22px;font-size:14px;}

/* ============ FORMS / CHECKOUT / ACCOUNT ============ */
.form-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media (min-width:600px){.form-grid.two{grid-template-columns:1fr 1fr;}}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--gray-line);border-radius:2px;font-size:14px;background:#fff;font-family:inherit;}
.field textarea{resize:vertical;min-height:80px;}
.checkout-layout{display:grid;grid-template-columns:1fr;gap:34px;}
@media (min-width:900px){.checkout-layout{grid-template-columns:1fr 360px;}}
.pay-opt{display:flex;align-items:center;gap:12px;border:1px solid var(--gray-line);border-radius:2px;padding:13px 14px;margin-bottom:10px;cursor:pointer;}
.pay-opt.active{border-color:var(--ink);background:var(--blue-soft);}
.pay-opt input{accent-color:var(--blue);}
.section-card{background:var(--white);border:1px solid var(--gray-line);border-radius:var(--radius-m);padding:24px;margin-bottom:20px;}
.section-card h3{font-size:16px;margin-bottom:16px;}

.auth-box{max-width:420px;margin:0 auto;}
.auth-tabs{display:flex;border-bottom:1px solid var(--gray-line);margin-bottom:24
